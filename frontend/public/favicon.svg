<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient (Stripe Royal Slate & Deep Navy) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="55%" stop-color="#1D4ED8"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Mortarboard Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>

    <!-- AI Intelligence Spark Gradient -->
    <linearGradient id="aiSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <!-- Subtle Glow for High Contrast in Browser Tabs -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Base with Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" fill="none"/>

  <!-- Academic Mortarboard Rhombus Top -->
  <path d="M31 16L51 25.5L31 35L11 25.5L31 16Z" fill="url(#capGrad)"/>
  
  <!-- Academic Cap Under-Band Base -->
  <path d="M20 30.5V38.5C20 44 42 44 42 38.5V30.5" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  
  <!-- Tassel Cord & Bead -->
  <path d="M46.5 28V38C46.5 40 45 41.5 43.5 41.5" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="43.5" cy="42" r="2" fill="#60A5FA"/>

  <!-- AI Intelligence Core Node (Cyan/Violet Sparkle Star) -->
  <g filter="url(#softGlow)">
    <!-- 4-point AI Multi-Agent Star -->
    <path d="M50 8C50 13 46 14.5 46 14.5C46 14.5 50 16 50 21C50 16 54 14.5 54 14.5C54 14.5 50 13 50 8Z" fill="url(#aiSpark)"/>
    <circle cx="50" cy="14.5" r="1.2" fill="#FFFFFF"/>
  </g>

  <!-- Central Multi-Agent Connected Node -->
  <circle cx="31" cy="25.5" r="2.5" fill="#1E3A8A"/>
  <circle cx="31" cy="25.5" r="1" fill="#60A5FA"/>
</svg>
